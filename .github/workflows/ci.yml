# Prüft jeden Pull Request: Format, Lint, Typen, Tests, npm audit, Geheimnis-Scan und Build.
# In den Branch-Schutzregeln von main als Pflicht-Prüfung ("checks") auswählen,
# dann lässt sich ein Pull Request nur mit grünen Prüfungen mergen.
name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
